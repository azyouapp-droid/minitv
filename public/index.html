<main><section class="home-panel" id="home-panel"><h1>Sua TV,<br>do seu jeito</h1><button class="hero art art-nature" id="hero-play" aria-label="Assistir canal em destaque"><span class="live-badge">● AO VIVO</span><span class="hero-caption"><strong id="hero-title">Natureza ao vivo</strong><small id="hero-subtitle">Escolha seu próximo favorito</small></span><span class="hero-play">▶</span></button><h2 class="small-heading">Categorias</h2><div id="home-chips" class="chips home-chips"></div><div class="section-row"><h2 class="small-heading" id="favorites-title">Seus favoritos</h2><button class="text-button" id="all-channels">Ver canais</button></div><div id="favorites-row" class="favorites-row"></div></section>
<section class="watch-panel"><div class="player-wrapper" id="player-wrapper"><video id="video" playsinline style="display:none"></video><iframe id="player-frame" title="Transmissão do canal" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen style="display:none"></iframe><div id="placeholder">Escolha um canal para começar</div><div class="player-top"><button id="back" class="glass-button" aria-label="Voltar aos canais">‹</button><span class="live-badge">● AO VIVO</span></div><div class="player-controls"><div class="volume-control"><button id="mute" aria-label="Silenciar"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H2v8h4l5 4Z"/><path id="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div><button id="fullscreen" class="glass-button" aria-label="Tela cheia"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div><div id="now" class="now"></div><div class="channel-info-card"><div class="info-header"><span class="channel-type" id="channel-type">Ao vivo</span><button id="current-fav" class="favorite-button" aria-label="Favoritar canal atual">♡</button></div><h2 id="title">Vamos assistir?</h2><span id="buffer-stat" hidden></span><p id="status" role="status"></p><div id="options" hidden></div><button class="primary explore-button" id="explore">▦ &nbsp; Explorar canais</button><div class="next-section"><h3>Mais para você</h3><div id="recommendation"></div></div></div></section>
<section class="browse" id="browse"><div class="section-row"><h1 id="browse-title">Canais</h1><span id="count"></span></div><div class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="Buscar canal" aria-label="Buscar canal"></div><select id="category" hidden><option value="all">Todos</option></select><div id="chips" class="chips" aria-label="Categorias"></div><div id="channels" class="channel-grid"></div><p class="browse-hint">ⓘ &nbsp; O canal só muda ao tocar em Assistir.</p><button id="reload" class="text-button reload">↻ Atualizar canais</button></section></main>
<nav class="bottom-nav" aria-label="Navegação principal"><button data-view="home" aria-label="Início"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg></button><button data-view="favorites" aria-label="Favoritos"><svg viewBox="0 0 24 24"><path d="M6 3h12v19l-6-4-6 4Z"/></svg></button><button id="nav-search" class="search-button" aria-label="Pesquisar canais"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><button data-view="notifications" aria-label="Notificações"><svg viewBox="0 0 24 24"><path d="M4 18h16l-2-4V9a6 6 0 0 0-12 0v5ZM9 21h6"/></svg></button><button data-view="settings" aria-label="Configurações"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 4 3 2 3-1 2 4 3-1 1-3 4-1 1-3-3-2 1-4-3-2-3 1Z"/><circle cx="12" cy="12" r="3"/></svg></button></nav><dialog id="dialog"><button id="close-dialog" class="icon-button" aria-label="Fechar">×</button><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog></div><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>    const $ = id => document.getElementById(id);
    let channels = [];
    let selected = null;
    let hls = null;
    let bufferMonitor = null;

    const categories = [
      'Canais abertos',
      'Esportes',
      'Filmes e séries',
      'Infantil',
      'Natureza',
      'Variedades',
      'Notícias',
      'Religião',
      'Adulto',
      'Outros'
    ];

    function categoryOf(c) {
      const n = (c.name || '').toLowerCase();
      if (/sexy hot|play boy|adulto/.test(n)) return 'Adulto';
      if (/globo news|band news|cnn brasil|record news/.test(n)) return 'Notícias';
      if (/espn|sportv|sporttv|sportynet|sporty|premiere|cazetv|combate|ufc|xsports|band sports|eleven|benfica tv|canal 11|a bola|prime video [234]/.test(n)) return 'Esportes';
      if (/^(globo |record |sbt |band |cultura|rede tv)/.test(n) || /^(globo|record|sbt|band|cultura)$/.test(n)) return 'Canais abertos';
      if (/gloob|discovery kids|cartoon|cartoonito|nickelodeon|nick|24h.*(naruto|pica pau|dragon ball|chaves)|disney/.test(n)) return 'Infantil';
      if (/telecine|hbo|max -|cinemax|megapix|tnt|warner|universal|paramount|sony channel|star channel|studio universal|prime video|space|tcm|ae|amc|axn|adult swim|24h/.test(n)) return 'Filmes e séries';
      if (/aparecida|canção nova|pai eterno|rede vida/.test(n)) return 'Religião';
      if (/discovery|animal planet|national geographic|nat geo/.test(n)) return 'Natureza';
      if (/discovery|history|animal planet|food network|gnt|multishow|mtv|tlc|hgtv|master chef|a fazenda|off/.test(n)) return 'Variedades';
      return 'Outros';
    }

    let view='home', hudTimer, hudHover=false, lastPointer=0;
    let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('minitv-favorites')||'[]'));}catch{}
    const key=c=>c.page||c.name;
    const icons={all:'▦','Canais abertos':'▣','Esportes':'⚽','Filmes e séries':'▤','Infantil':'☺','Natureza':'♧','Notícias':'▧','Variedades':'✦','Religião':'☼','Adulto':'◈','Outros':'▦'};
    const shortLabel=g=>({'all':'Todos','Filmes e séries':'Filmes','Canais abertos':'Abertos'}[g]||g);
    const artOf=c=>{const g=categoryOf(c);return g==='Esportes'?'sports':g==='Infantil'?'kids':g==='Filmes e séries'?'movies':g==='Notícias'?'news':g==='Natureza'?(/animal/.test(c.name.toLowerCase())?'jungle':'nature'):'movies';};
    const initial=c=>c.name.split(/\s+/).slice(0,2).map(w=>w[0]).join('');
    function persist(){try{localStorage.setItem('minitv-favorites',JSON.stringify([...saved]));}catch{}}
    function favorite(c){if(saved.has(key(c)))saved.delete(key(c));else saved.add(key(c));persist();render();}
    function setMode(mode){view=mode;$('app').dataset.mode=selected&&mode==='favorites'?'explore':mode;$('app').classList.remove('mode-enter');requestAnimationFrame(()=>$('app').classList.add('mode-enter'));}
    function navigate(mode){$('search').value='';$('category').value='all';if(document.fullscreenElement){setMode(mode==='favorites'?'favorites':'explore');wakeHud();}else setMode(selected&&mode==='channels'?'explore':mode);render();}
    function refreshCategories(){const current=$('category').value;const present=new Set(channels.map(categoryOf));$('category').replaceChildren(new Option('Todos','all'));for(const name of categories)if(present.has(name))$('category').add(new Option(name,name));$('category').value=present.has(current)?current:'all';}
    function renderChips(target,home=false){const present=categories.filter(g=>channels.some(c=>categoryOf(c)===g));const names=home?['all','Filmes e séries','Esportes','Notícias','Infantil','Natureza']:['all',...present];target.replaceChildren();for(const group of names){const b=document.createElement('button');b.className='chip'+($('category').value===group?' active':'');b.textContent=(icons[group]||'▦')+'  '+shortLabel(group);b.setAttribute('aria-pressed',String($('category').value===group));b.onclick=()=>{if(home)setMode(selected?'explore':'channels');$('category').value=group;render();wakeHud();};target.append(b);}}
    function render(){
      const term=$('search').value.toLocaleLowerCase('pt-BR').trim(),wanted=$('category').value;
      const filtered=channels.filter(c=>(view!=='favorites'||saved.has(key(c)))&&c.name.toLocaleLowerCase('pt-BR').includes(term)&&(wanted==='all'||categoryOf(c)===wanted));
      $('count').textContent=filtered.length+(filtered.length===1?' canal':' canais');$('browse-title').textContent=view==='favorites'?'Seus favoritos':selected?'Escolha o próximo canal':'Canais';
      renderChips($('chips'));renderChips($('home-chips'),true);$('channels').replaceChildren();
      if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent=view==='favorites'?'Salve seus canais no coração. Eles ficam aqui.':channels.length?'Nenhum canal encontrado. Tente outra busca.':'Carregando canais…';$('channels').append(p);}
      for(const group of categories){const items=filtered.filter(c=>categoryOf(c)===group).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{numeric:true}));if(!items.length)continue;const heading=document.createElement('h2');heading.className='group-title';heading.textContent=group;$('channels').append(heading);
        for(const c of items){const active=selected&&key(c)===key(selected);const card=document.createElement('article');card.className='channel-card'+(active?' active':'');const thumb=document.createElement('div');thumb.className='channel-thumb art art-'+artOf(c);thumb.setAttribute('aria-hidden','true');const content=document.createElement('div');content.className='card-content';const meta=document.createElement('div');meta.className='card-meta';const cat=document.createElement('span');cat.className='card-category';cat.textContent=shortLabel(group);const live=document.createElement('span');live.className='live-badge';live.textContent='● AO VIVO';meta.append(cat,live);const h=document.createElement('h3');h.textContent=c.name;const desc=document.createElement('p');desc.className='card-description';desc.textContent=active?'Assistindo agora':'Transmissão ao vivo';const actions=document.createElement('div');actions.className='card-actions';const play=document.createElement('button');play.className='watch-btn';play.textContent=active?'Assistindo':'▶ Assistir';play.setAttribute('aria-label',(active?'Assistindo: ':'Assistir: ')+c.name);play.onclick=()=>{if(!active)playChannel(c);else if(!document.fullscreenElement){setMode('live');render();}wakeHud();};const fav=document.createElement('button');fav.className='favorite-button'+(saved.has(key(c))?' saved':'');fav.textContent=saved.has(key(c))?'♥':'♡';fav.setAttribute('aria-label',(saved.has(key(c))?'Remover dos favoritos: ':'Favoritar: ')+c.name);fav.setAttribute('aria-pressed',String(saved.has(key(c))));fav.onclick=()=>favorite(c);actions.append(play,fav);content.append(meta,h,desc,actions);card.append(thumb,content);$('channels').append(card);}
      }
      const featured=channels.find(c=>c.name==='Discovery Channel')||channels.find(c=>categoryOf(c)==='Natureza')||channels[0];if(featured){$('hero-title').textContent=featured.name;$('hero-subtitle').textContent='Natureza, descobertas e histórias';$('hero-play').onclick=()=>playChannel(featured);}
      const favorites=channels.filter(c=>saved.has(key(c)));const tiles=favorites.length?favorites:channels.filter(c=>['Discovery Channel','Espn','Cartoon Network','Globo SP','HBO','CNN Brasil'].includes(c.name)).slice(0,6);$('favorites-title').textContent=favorites.length?'Seus favoritos':'Para começar';$('favorites-row').replaceChildren();for(const c of tiles.slice(0,6)){const b=document.createElement('button');b.className='favorite-tile';const mark=document.createElement('span');mark.className='channel-mark';mark.textContent=initial(c);const label=document.createElement('span');label.textContent=c.name;b.append(mark,label);b.onclick=()=>playChannel(c);$('favorites-row').append(b);}
      $('current-fav').textContent=selected&&saved.has(key(selected))?'♥':'♡';$('current-fav').classList.toggle('saved',!!selected&&saved.has(key(selected)));if(selected){$('now').textContent=selected.name+' • Assistindo agora';$('channel-type').textContent=categoryOf(selected);const next=channels.find(c=>key(c)!==key(selected)&&categoryOf(c)===categoryOf(selected));$('recommendation').replaceChildren();if(next){const b=document.createElement('button');b.className='next-card';const art=document.createElement('span');art.className='art art-'+artOf(next);const text=document.createElement('span');const title=document.createElement('strong');title.textContent=next.name;const sub=document.createElement('small');sub.textContent='Ao vivo • '+categoryOf(next);text.append(title,sub);b.append(art,text);b.onclick=()=>playChannel(next);$('recommendation').append(b);}}
      document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
    }
    function wakeHud(){if(!document.fullscreenElement)return;$('app').classList.add('hud-visible');clearTimeout(hudTimer);hudTimer=setTimeout(()=>{const focused=document.activeElement;if(hudHover||focused?.matches('input')||$('dialog').open){wakeHud();return;}$('app').classList.remove('hud-visible');},3500);}
    $('app').addEventListener('pointermove',()=>{if(Date.now()-lastPointer>150){lastPointer=Date.now();wakeHud();}});$('app').addEventListener('pointerdown',wakeHud);$('app').addEventListener('keydown',wakeHud);
    for(const node of [$('browse'),document.querySelector('.bottom-nav')]){node.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hudHover=true;});node.addEventListener('pointerleave',()=>{hudHover=false;wakeHud();});}
    $('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('app').requestFullscreen)await $('app').requestFullscreen();else if($('video').webkitEnterFullscreen)$('video').webkitEnterFullscreen();}catch{$('status').textContent='A tela cheia não está disponível neste navegador.';}};
    document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;$('fullscreen').setAttribute('aria-label',full?'Sair da tela cheia':'Tela cheia');if(full){setMode('explore');render();wakeHud();}else{clearTimeout(hudTimer);$('app').classList.remove('hud-visible');hudHover=false;setMode('explore');render();}});
    const syncVolume=()=>{const v=$('video');$('volume').value=v.muted?0:v.volume;const silent=v.muted||v.volume===0;$('mute').setAttribute('aria-label',silent?'Ativar som':'Silenciar');$('sound-waves').setAttribute('d',silent?'m16 9 6 6m0-6-6 6':'M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14');};$('volume').oninput=()=>{const v=$('video');v.volume=Number($('volume').value);v.muted=v.volume===0;syncVolume();};$('mute').onclick=()=>{const v=$('video');if(v.muted||v.volume===0){v.muted=false;if(v.volume===0)v.volume=.5;}else v.muted=true;syncVolume();};$('video').addEventListener('volumechange',syncVolume);
    function search(){navigate(selected?'explore':'channels');$('search').focus();wakeHud();}
    function dialog(title,text){$('dialog-title').textContent=title;$('dialog-body').textContent=text;$('dialog').showModal();}
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const dest=b.dataset.view;if(dest==='notifications'){dialog('Notificações','Você não tem novas notificações.');return;}if(dest==='settings'){dialog('Sua Mini TV','Os favoritos ficam salvos neste navegador. Use o controle no vídeo para ajustar o volume e entrar em tela cheia. As imagens dos cards ilustram as categorias.');return;}navigate(dest);});
    $('profile').onclick=()=>document.querySelector('[data-view="settings"]').click();$('brand').onclick=e=>{e.preventDefault();navigate('home');};$('nav-search').onclick=search;$('top-search').onclick=search;$('all-channels').onclick=()=>navigate('channels');$('explore').onclick=()=>navigate('explore');$('back').onclick=()=>navigate('explore');$('current-fav').onclick=()=>{if(selected)favorite(selected);};$('close-dialog').onclick=()=>$('dialog').close();

    async function playChannel(c, mode = 'direct', embedIndex = 0) {
      selected = c;
      setMode(document.fullscreenElement?'explore':'live');
      render();

      $('placeholder').style.display = 'none';
      $('title').textContent = c.name;
      $('options').replaceChildren();

      const video = $('video');
      const frame = $('player-frame');

      if (bufferMonitor) clearInterval(bufferMonitor);
      $('buffer-stat').style.display = 'none';

      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.onclick=()=>{if(document.fullscreenElement)wakeHud();else if(video.paused)video.play().catch(()=>{});};
      video.pause();
      video.removeAttribute('src');
      video.load();

      const embedUrl = c.embeds?.[embedIndex]?.url || c.embeds?.[0]?.url || '';

      if (mode === 'direct') {
        frame.style.display = 'none';
        frame.src = 'about:blank';
        video.style.display = 'block';
        $('status').textContent = `Conectando stream de ${c.name}...`;

        let streamTarget = c.stream || '';
        if (embedUrl) {
          try {
            const resp = await fetch(embedUrl, { signal: AbortSignal.timeout(3500) });
            if (resp.ok) {
              const html = await resp.text();
              const match = html.match(/const src\s*=\s*"(https:\/\/[^"\s]+)"/)?.[1];
              if (match && !match.includes('akamaized.net')) {
                streamTarget = match;
                c.stream = match;
              }
            }
          } catch {}
        }

        if (!streamTarget) {
          $('status').textContent = 'Stream direto indisponível. Alternando para o player web...';
          playChannel(c, 'embed', embedIndex);
          return;
        }

        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            enableWorker: false,
            lowLatencyMode: false,
            maxLiveSyncPlaybackRate: 1.0,      // NUNCA acelerar reprodução para evitar esgotar buffer
            liveSyncDurationCount: 3,         // 3 blocos de segurança (~18s da ponta)
            liveMaxLatencyDurationCount: 6,
            maxBufferLength: 20,              // Janela compatível
            maxMaxBufferLength: 30,
            backBufferLength: 10,
            maxBufferSize: 50 * 1024 * 1024,
            highBufferWatchdogPeriod: 2,
            nudgeOffset: 0.2,
            nudgeMaxRetry: 5,
            fragLoadingTimeOut: 15000,
            fragLoadingMaxRetry: 6,
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 6
          });

          hls.loadSource(streamTarget);
          hls.attachMedia(video);

          let playTriggered = false;
          const startPlayback = () => {
            if (playTriggered) return;
            playTriggered = true;
            video.play().then(() => {
              $('status').textContent = `Assistindo ${c.name} (Ao Vivo)`;
            }).catch(() => {
              $('status').textContent = `Clique no player de vídeo para iniciar.`;
            });
          };

          video.oncanplay = startPlayback;
          video.onplaying = () => {
            $('status').textContent = `Assistindo ${c.name} (Ao Vivo)`;
          };
          video.onwaiting = () => {
            $('status').textContent = `Bufferizando...`;
          };

          // Monitor de Buffer em tempo real:
          $('buffer-stat').style.display = 'inline-block';
          bufferMonitor = setInterval(() => {
            if (video.buffered.length > 0) {
              const cur = video.currentTime;
              let end = 0;
              for (let i = 0; i < video.buffered.length; i++) {
                if (video.buffered.start(i) <= cur && cur <= video.buffered.end(i)) {
                  end = video.buffered.end(i);
                  break;
                }
              }
              const forward = Math.max(0, end - cur);
              $('buffer-stat').textContent = `Buffer: ${forward.toFixed(1)}s`;
              $('buffer-stat').style.color = forward > 6 ? '#4ade80' : '#f59e0b';
            }
          }, 1000);

          let networkErrors = 0;
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR && networkErrors < 2) {
                networkErrors++;
                hls.startLoad();
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              } else {
                $('status').textContent = 'Stream direto indisponível. Alternando para o player web...';
                playChannel(c, 'embed', embedIndex);
              }
            }
          });
        } else {
          video.src = streamTarget;
          video.play().catch(() => {});
        }

        // Botão de recarregar sinal rápido
        const reloadBtn = document.createElement('button');
        reloadBtn.className = 'opt-btn';
        reloadBtn.innerHTML = '⚡ Recarregar Sinal';
        reloadBtn.onclick = () => playChannel(c, 'direct', embedIndex);
        $('options').append(reloadBtn);

        if (c.embeds && c.embeds.length > 0) {
          const altBtn = document.createElement('button');
          altBtn.className = 'opt-btn';
          altBtn.innerHTML = '🔄 Player Web Oficial';
          altBtn.onclick = () => playChannel(c, 'embed', embedIndex);
          $('options').append(altBtn);
        }

      } else {
        video.style.display = 'none';
        frame.style.display = 'block';

        const activeEmbed = c.embeds[embedIndex] || c.embeds[0];
        frame.src = activeEmbed ? activeEmbed.url : 'about:blank';

        $('status').textContent = `Reproduzindo ${c.name} via Player Web.`;

        const directBtn = document.createElement('button');
        directBtn.className = 'opt-btn active';
        directBtn.innerHTML = '⚡ Modo Stream Direto';
        directBtn.onclick = () => playChannel(c, 'direct');
        $('options').append(directBtn);

        c.embeds.forEach((emb, idx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn' + (idx === embedIndex ? ' active' : '');
          btn.textContent = emb.label || `Opção ${idx + 1}`;
          btn.onclick = () => playChannel(c, 'embed', idx);
          $('options').append(btn);
        });
      }
    }

    async function loadCatalog() {
      $('count').textContent = 'Carregando lista Multicanais...';
      $('reload').disabled = true;

      try {
        const response = await fetch('./multicanais-embed-catalog.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Falha ao baixar catálogo');

        const catalog = await response.json();
        const validChannels = (catalog.channels || [])
          .filter(c => c.embeds?.length > 0 || c.stream)
          .map(c => {
            return {
              ...c,
              name: c.name.replace(/&amp;/g, '&')
            };
          });

        if (!validChannels.length) throw new Error('Nenhum canal na lista');

        channels = validChannels;
        if(selected)selected=channels.find(c=>key(c)===key(selected))||selected;
        refreshCategories();
        render();

        let updatedTime = '';
        if (catalog.retrievedAt) {
          try {
            updatedTime = new Intl.DateTimeFormat('pt-BR', {
              timeZone: 'America/Sao_Paulo',
              dateStyle: 'short',
              timeStyle: 'short'
            }).format(new Date(catalog.retrievedAt));
          } catch {}
        }

        $('status').textContent = updatedTime
          ? `Catálogo Multicanais sincronizado em ${updatedTime} (${channels.length} canais carregados).`
          : `Catálogo Multicanais carregado (${channels.length} canais).`;
      } catch (err) {
        console.error(err);
        $('count').textContent = 'Erro ao carregar';
        $('status').textContent = 'Não foi possível carregar a lista de canais do Multicanais.';
      } finally {
        $('reload').disabled = false;
      }
    }

    $('search').oninput = ()=>{if(view==='home')setMode(selected?'explore':'channels');render();wakeHud();};
    $('category').onchange = render;

    $('reload').onclick = async () => {
      $('reload').disabled = true;
      $('count').textContent = 'Atualizando canais do Multicanais...';
      try {
        const resp = await fetch('./refresh', { method: 'POST' });
        if (!resp.ok) throw new Error();
      } catch (e) {
        console.warn('Recarregando lista local.');
      }
      await loadCatalog();
    };

    loadCatalog();
  </script></body></html>
