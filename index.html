und:linear-gradient(135deg,#f4f8fc,#eef4fa);border:1px solid #e2edf7}.epg-details-header{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--blue);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}.epg-title{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 4px}.epg-desc{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.epg-next{font-size:11px;color:var(--muted);border-top:1px dashed #d6e2ed;padding-top:7px;margin-top:8px}.epg-next strong{color:var(--ink)}.event-card{background:linear-gradient(135deg,#ffffff,#f6faff);border:1px solid #e1effa}.event-matchup{display:flex;align-items:center;justify-content:space-around;gap:8px;margin:8px 0 10px;padding:8px;background:#f0f6fc;border-radius:13px}.event-team{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;text-align:center;min-width:0}.event-team img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.12))}.event-team span{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.event-vs{font-size:10px;font-weight:800;color:#8ba3bc;padding:0 4px}.event-live-badge{background:#fff0f1;color:#f14c58;font-size:8px;font-weight:800;padding:3px 7px;border-radius:12px}.event-time-badge{background:#e8f3ff;color:#087bff;font-size:8px;font-weight:800;padding:3px 7px;border-radius:12px}#options{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}.opt-btn{background:#eef4fa;color:#1e3552;border-radius:18px;padding:8px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s ease;border:1.5px solid #d8e5f2}.opt-btn:hover{background:#e2edf7;border-color:#b8d1ea}.opt-btn.active{background:#087bff;color:#fff;border-color:#087bff;box-shadow:0 3px 10px rgba(8,123,255,0.25)}

.browse,.watch-panel,.home-panel{min-width:0}.app[data-mode="explore"] main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.chip svg{flex-shrink:0;width:17px;height:17px;stroke-width:1.8}.chip span{line-height:1.15}@media(max-width:360px){.chip{gap:5px;padding-left:8px;padding-right:8px}.chip svg{width:15px;height:15px}.channel-thumb{width:86px}.channel-card{gap:9px}.channel-card h3{font-size:15px}}</style></head><body><div class="app" id="app" data-mode="home">
<header><a class="brand" href="#" id="brand">mini<span>tv</span></a></header>
<main><section class="home-panel" id="home-panel"><h1>Sua TV,<br>do seu jeito</h1><button class="hero art art-nature" id="hero-play" aria-label="Assistir canal em destaque"><span class="live-badge">● AO VIVO</span><span class="hero-caption"><strong id="hero-title">Natureza ao vivo</strong><small id="hero-subtitle">Escolha seu próximo favorito</small></span><span class="hero-play">▶</span></button><h2 class="small-heading">Categorias</h2><div id="home-chips" class="chips home-chips"></div><div class="section-row"><h2 class="small-heading" id="favorites-title">Seus favoritos</h2><button class="text-button" id="all-channels">Ver canais</button></div><div id="favorites-row" class="favorites-row"></div></section>
<section class="watch-panel"><div class="player-wrapper" id="player-wrapper"><video id="video" playsinline style="display:none"></video><div id="placeholder">Escolha um canal para começar</div><div id="player-spinner" class="player-spinner" style="display:none"><div class="spinner-ring"></div><span id="player-spinner-text">Sintonizando sinal...</span></div><div class="player-top"><button id="back" class="glass-button" aria-label="Voltar aos canais">‹</button><span class="live-badge">● AO VIVO</span></div><div class="player-controls"><div class="volume-control"><button id="mute" aria-label="Silenciar"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H2v8h4l5 4Z"/><path id="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div><button id="fullscreen" class="glass-button" aria-label="Tela cheia"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div><div id="now" class="now"></div><div class="channel-info-card"><div class="info-header"><div style="display:flex;align-items:center;gap:12px;min-width:0"><img id="player-channel-logo" class="player-channel-logo" style="display:none" alt="Logo"><div style="min-width:0"><span class="channel-type" id="channel-type">Ao vivo</span><h2 id="title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Vamos assistir?</h2></div></div><button id="current-fav" class="favorite-button" aria-label="Favoritar canal atual">♡</button></div><div id="epg-details" class="epg-details" style="display:none"><div class="epg-details-header"><span>● Agora no canal</span></div><div class="epg-title" id="epg-prog-title"></div><p class="epg-desc" id="epg-prog-desc"></p><div class="epg-next" id="epg-next-box" style="display:none"><strong>A seguir:</strong> <span id="epg-prog-next"></span></div></div><span id="buffer-stat" hidden></span><p id="status" role="status"></p><button class="primary explore-button" id="explore">▦ &nbsp; Explorar canais</button><div class="next-section"><h3>Mais para você</h3><div id="recommendation"></div></div></div></section>
<section class="browse" id="browse"><div class="section-row"><h1 id="browse-title">Canais</h1><span id="count"></span></div><div class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="Buscar canal" aria-label="Buscar canal"></div><select id="category" hidden><option value="all">Todos</option></select><div id="chips" class="chips" aria-label="Categorias"></div><div id="channels" class="channel-grid"></div><p class="browse-hint">ⓘ &nbsp; O canal só muda ao tocar em Assistir.</p><button id="reload" class="text-button reload">↻ Atualizar canais</button></section></main>
<nav class="bottom-nav" aria-label="Navegação principal"><button data-view="home" aria-label="Início"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg></button><button data-view="favorites" aria-label="Favoritos"><svg viewBox="0 0 24 24"><path d="M6 3h12v19l-6-4-6 4Z"/></svg></button><button id="nav-search" class="search-button" aria-label="Pesquisar canais"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><button data-view="notifications" aria-label="Notificações"><svg viewBox="0 0 24 24"><path d="M4 18h16l-2-4V9a6 6 0 0 0-12 0v5ZM9 21h6"/></svg></button><button data-view="settings" aria-label="Configurações"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 4 3 2 3-1 2 4 3-1 1-3 4-1 1-3-3-2 1-4-3-2-3 1Z"/><circle cx="12" cy="12" r="3"/></svg></button></nav><dialog id="dialog"><button id="close-dialog" class="icon-button" aria-label="Fechar">×</button><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog></div><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>    const $ = id => document.getElementById(id);
    let channels = [];
    let selected = null;
    let hls = null;
    let bufferMonitor = null;
    let epgData = new Map();
    let liveEvents = [];

    const categories = [
      'Jogos de hoje',
      'Canais abertos',
      'Esportes',
      'Filmes e séries',
      'Infantil',
      'Natureza',
      'Variedades',
      'Notícias',
      'Religião',
      'Adulto',
      'Outros'
    ];

    function categoryOf(c) {
      if (c.isEvent || c.category === 'Jogos de hoje') return 'Jogos de hoje';
      const n = (c.name || '').toLowerCase();
      if (/sexy hot|play boy|adulto/.test(n)) return 'Adulto';
      if (/globo news|band news|cnn brasil|record news/.test(n)) return 'Notícias';
      if (/espn|sportv|sporttv|sportynet|sporty|premiere|cazetv|combate|ufc|xsports|band sports|eleven|benfica tv|canal 11|a bola|prime video [234]/.test(n)) return 'Esportes';
      if (/^(globo |record |sbt |band |cultura|rede tv)/.test(n) || /^(globo|record|sbt|band|cultura)$/.test(n)) return 'Canais abertos';
      if (/gloob|discovery kids|cartoon|cartoonito|nickelodeon|nick|24h.*(naruto|pica pau|dragon ball|chaves)|disney/.test(n)) return 'Infantil';
      if (/telecine|hbo|max -|cinemax|megapix|tnt|warner|universal|paramount|sony channel|star channel|studio universal|prime video|space|tcm|ae|amc|axn|adult swim|24h/.test(n)) return 'Filmes e séries';
      if (/aparecida|canção nova|pai eterno|rede vida/.test(n)) return 'Religião';
      if (/discovery|animal planet|national geographic|nat geo/.test(n)) return 'Natureza';
      if (/discovery|history|animal planet|food network|gnt|multishow|mtv|tlc|hgtv|master chef|a fazenda|off/.test(n)) return 'Variedades';
      return 'Outros';
    }

    function getEpgForChannel(c) {
      if (!c || !epgData.size) return null;
      const id = (c.id || '').toLowerCase();
      const rawId = (c.page || c.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      let list = epgData.get(id) || epgData.get(rawId);
      if (!list) {
        if (/^sbt/.test(id)) list = epgData.get('sbt');
        else if (/^record/.test(id) && !id.includes('news')) list = epgData.get('record');
        else if (/^band/.test(id) && !id.includes('news') && !id.includes('sports')) list = epgData.get('band');
        else if (/^redetv/.test(id)) list = epgData.get('redetv');
      }
      if (!list || !list.length) return null;

      const now = Date.now();
      for (let i = 0; i < list.length; i++) {
        const item = list[i];
        const start = new Date(item.start_date).getTime();
        const nextStart = list[i + 1] ? new Date(list[i + 1].start_date).getTime() : (start + 3600000);
        if (now >= start && now < nextStart) {
          return {
            current: item,
            next: list[i + 1] || null
          };
        }
      }
      if (now < new Date(list[0].start_date).getTime()) {
        return { current: null, next: list[0] };
      }
      return { current: list[list.length - 1], next: null };
    }

    let view='home', hudTimer, hudHover=false, lastPointer=0;
    let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('minitv-favorites')||'[]'));}catch{}
    const key=c=>c.page||c.name;
    const icons={all:'▦','Jogos de hoje':'⚽','Canais abertos':'▣','Esportes':'⚽','Filmes e séries':'▤','Infantil':'☺','Natureza':'♧','Notícias':'▧','Variedades':'✦','Religião':'☼','Adulto':'◈','Outros':'▦'};
    const shortLabel=g=>({'all':'Todos','Jogos de hoje':'Jogos','Filmes e séries':'Filmes','Canais abertos':'Abertos'}[g]||g);
    const artOf=c=>{const g=categoryOf(c);return g==='Esportes'||g==='Jogos de hoje'?'sports':g==='Infantil'?'kids':g==='Filmes e séries'?'movies':g==='Notícias'?'news':g==='Natureza'?(/animal/.test(c.name.toLowerCase())?'jungle':'nature'):'movies';};
    const initial=c=>c.name.split(/\s+/).slice(0,2).map(w=>w[0]).join('');
    function persist(){try{localStorage.setItem('minitv-favorites',JSON.stringify([...saved]));}catch{}}
    function favorite(c){if(saved.has(key(c)))saved.delete(key(c));else saved.add(key(c));persist();render();}
    function setMode(mode){view=mode;$('app').dataset.mode=selected&&mode==='favorites'?'explore':mode;$('app').classList.remove('mode-enter');requestAnimationFrame(()=>$('app').classList.add('mode-enter'));}
    function navigate(mode){$('search').value='';$('category').value='all';if(document.fullscreenElement){setMode(mode==='favorites'?'favorites':'explore');wakeHud();}else setMode(selected&&mode==='channels'?'explore':mode);render();}
    function refreshCategories(){const current=$('category').value;const present=new Set(channels.map(categoryOf));if(liveEvents.length>0)present.add('Jogos de hoje');$('category').replaceChildren(new Option('Todos','all'));for(const name of categories)if(present.has(name))$('category').add(new Option(name,name));$('category').value=present.has(current)?current:'all';}
    function renderChips(target,home=false){
      const present=categories.filter(g=>(g==='Jogos de hoje'&&liveEvents.length>0)||channels.some(c=>categoryOf(c)===g));
      const names=home?(liveEvents.length>0?['all','Jogos de hoje','Filmes e séries','Esportes','Notícias','Infantil']:['all','Filmes e séries','Esportes','Notícias','Infantil','Natureza']):['all',...present];
      target.replaceChildren();
      for(const group of names){
        const b=document.createElement('button');
        b.className='chip'+($('category').value===group?' active':'');
        const iconPaths={all:'M3 3h6v6H3ZM15 3h6v6h-6ZM3 15h6v6H3ZM15 15h6v6h-6Z','Canais abertos':'M3 6h18v13H3ZM8 3l4 3 4-3M9 22h6','Filmes e séries':'M3 8h18v13H3ZM3 3h18v5H3ZM7 3l3 5M14 3l3 5','Esportes':'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 8l5 4-2 5H9l-2-5ZM12 3v5M21 12h-4M17 20l-2-3M7 20l2-3M3 12h4','Infantil':'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M8 10h.01M16 10h.01M8 15q4 4 8 0','Natureza':'M20 3C6 2 2 8 5 16c8 5 16-1 15-13ZM3 21 16 8','Notícias':'M3 4h18v17H3ZM6 7h5v6H6ZM14 7h4M14 10h4M14 13h4M6 17h12','Jogos de hoje':'M7 3h10v7a5 5 0 0 1-10 0ZM7 5H3v4a4 4 0 0 0 4 4M17 5h4v4a4 4 0 0 1-4 4M12 15v6M7 21h10'};
        const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',iconPaths[group]||'m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3Z');icon.append(path);const label=document.createElement('span');label.textContent=shortLabel(group);b.append(icon,label);b.setAttribute('aria-label',shortLabel(group));
        b.setAttribute('aria-pressed',String($('category').value===group));
        b.onclick=()=>{if(home)setMode(selected?'explore':'channels');$('category').value=group;render();wakeHud();};
        target.append(b);
      }
    }

    function render(){
      const term=$('search').value.toLocaleLowerCase('pt-BR').trim(),wanted=$('category').value;
      const filtered=channels.filter(c=>(view!=='favorites'||saved.has(key(c)))&&c.name.toLocaleLowerCase('pt-BR').includes(term)&&(wanted==='all'||categoryOf(c)===wanted));
      const eventMatches = (view!=='favorites' && (wanted==='all'||wanted==='Jogos de hoje')) ? liveEvents.filter(ev => {
        if(!term) return true;
        const s = ((ev.title||'')+' '+(ev.league?.name||'')+' '+(ev.teams?.home?.name||'')+' '+(ev.teams?.away?.name||'')).toLowerCase();
        return s.includes(term);
      }) : [];

      const totalCount = filtered.length + (wanted==='Jogos de hoje' ? eventMatches.length : (wanted==='all' ? eventMatches.length : 0));
      $('count').textContent = totalCount + (totalCount===1 ? ' canal/evento' : ' canais');
      $('browse-title').textContent = view==='favorites' ? 'Seus favoritos' : selected ? 'Escolha o próximo canal' : 'Canais';
      renderChips($('chips'));renderChips($('home-chips'),true);$('channels').replaceChildren();

      // Renderizar Jogos de Hoje se houver
      if (eventMatches.length > 0 && (wanted==='all' || wanted==='Jogos de hoje')) {
        const evHeading = document.createElement('h2');
        evHeading.className = 'group-title';
        evHeading.textContent = '⚽ Jogos de hoje';
        $('channels').append(evHeading);

        for (const ev of eventMatches) {
          const pseudo = {
            name: ev.title,
            page: 'event-' + (ev.id || ev.title),
            category: 'Jogos de hoje',
            isEvent: true,
            image: ev.league?.image || ev.teams?.home?.image || '',
            embeds: (ev.players || []).map((url, i) => ({ label: `Opção ${i+1}`, url })),
            stream: ''
          };
          const active = selected && selected.page === pseudo.page;
          const card = document.createElement('article');
          card.className = 'channel-card event-card' + (active ? ' active' : '');

          const thumb = document.createElement('div');
          thumb.className = 'channel-thumb art art-sports';
          if (ev.league?.image) {
            const limg = document.createElement('img');
            limg.src = ev.league.image;
            limg.className = 'channel-logo';
            limg.alt = ev.league.name || 'Liga';
            limg.loading = 'lazy';
            limg.onerror = () => limg.remove();
            thumb.append(limg);
          }

          const content = document.createElement('div');
          content.className = 'card-content';
          const meta = document.createElement('div');
          meta.className = 'card-meta';
          const cat = document.createElement('span');
          cat.className = 'card-category';
          cat.textContent = ev.league?.name || 'Futebol';

          const nowMs = Date.now();
          const startMs = ev.time_start ? new Date(ev.time_start).getTime() : 0;
          const endMs = ev.time_end ? new Date(ev.time_end).getTime() : (startMs + 7200000);
          const isLive = startMs && (startMs <= nowMs && nowMs <= endMs);
          const timeStr = ev.time_start ? new Intl.DateTimeFormat('pt-BR', { hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' }).format(new Date(ev.time_start)) : '';

          const badge = document.createElement('span');
          badge.className = isLive ? 'event-live-badge' : 'event-time-badge';
          badge.textContent = isLive ? '● AO VIVO' : `⏰ ${timeStr}`;
          meta.append(cat, badge);

          const h = document.createElement('h3');
          h.textContent = ev.title;

          if (ev.teams?.home || ev.teams?.away) {
            const matchup = document.createElement('div');
            matchup.className = 'event-matchup';
            const hTeam = document.createElement('div');
            hTeam.className = 'event-team';
            if (ev.teams.home?.image) {
              const hImg = document.createElement('img');
              hImg.src = ev.teams.home.image;
              hImg.alt = '';
              hImg.onerror = () => hImg.remove();
              hTeam.append(hImg);
            }
            const hName = document.createElement('span');
            hName.textContent = ev.teams.home?.name || 'Mandante';
            hTeam.append(hName);

            const vs = document.createElement('span');
            vs.className = 'event-vs';
            vs.textContent = 'VS';

            const aTeam = document.createElement('div');
            aTeam.className = 'event-team';
            if (ev.teams.away?.image) {
              const aImg = document.createElement('img');
              aImg.src = ev.teams.away.image;
              aImg.alt = '';
              aImg.onerror = () => aImg.remove();
              aTeam.append(aImg);
            }
            const aName = document.createElement('span');

    async function playChannel(c, forceProxy = false) {
      if (document.fullscreenElement) {
        $('app').classList.remove('browse-open');
      }
      selected = c;
      setMode(document.fullscreenElement ? 'explore' : 'live');
      render();

      $('placeholder').style.display = 'none';
      $('title').textContent = c.name;

      const video = $('video');
      video.style.display = 'block';

      const spinner = $('player-spinner');
      const spinnerText = $('player-spinner-text');
      if (spinner) {
        spinner.style.display = 'flex';
        spinnerText.textContent = `Sintonizando ${c.name}...`;
      }

      if (bufferMonitor) clearInterval(bufferMonitor);
      if (watchdogTimer) clearInterval(watchdogTimer);
      $('buffer-stat').style.display = 'none';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      // Rota proxy inteligente local (elimina bloqueios de adblockers, operadoras e CORS)
      const directStream = c.stream || '';
      const embedUrl = c.embeds?.[0]?.url || '';
      const proxyUrl = `/m3u8?url=${encodeURIComponent(directStream)}&embed=${encodeURIComponent(embedUrl)}`;

      let streamUrl = forceProxy ? (directStream || proxyUrl) : (proxyUrl || directStream);

      if (!streamUrl && c.isEvent && c.embeds?.[0]?.url) {
        const slug = (c.embeds[0].url || '').replace(/.*\/([^\/]+)$/, '$1').toLowerCase();
        const matched = channels.find(ch => (ch.id && ch.id.toLowerCase() === slug) || (ch.page && ch.page.toLowerCase().includes('/' + slug + '/')));
        if (matched?.stream) {
          streamUrl = `/m3u8?url=${encodeURIComponent(matched.stream)}`;
        } else {
          streamUrl = `/m3u8?embed=${encodeURIComponent(c.embeds[0].url)}`;
        }
      }

      if (!streamUrl) {
        if (spinner) spinner.style.display = 'none';
        $('status').textContent = 'Sinal temporariamente indisponível para este canal.';
        return;
      }

      $('status').textContent = `Sintonizando ${c.name}...`;

      video.onclick = () => {
        if (document.fullscreenElement) {
          if ($('app').classList.contains('browse-open')) {
            $('app').classList.remove('browse-open');
            wakeHud();
            return;
          }
          wakeHud();
        } else if (video.paused) {
          video.play().catch(() => {});
        }
      };

      let waitingTimeout = null;
      const hideSpinner = () => {
        if (waitingTimeout) {
          clearTimeout(waitingTimeout);
          waitingTimeout = null;
        }
        if (spinner) spinner.style.display = 'none';
      };

      const startPlayback = () => {
        video.play().then(() => {
          hideSpinner();
          $('status').textContent = `Assistindo ${c.name} (Ao Vivo)`;
        }).catch(() => {
          video.muted = true;
          syncVolume();
          video.play().then(() => {
            hideSpinner();
            $('status').textContent = `Assistindo ${c.name} (Toque no som para ativar áudio)`;
          }).catch(() => {
            hideSpinner();
            $('status').textContent = `Toque no player para iniciar a transmissão.`;
          });
        });
      };

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          liveSyncDurationCount: 3,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          backBufferLength: 30,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 10000,
          levelLoadingMaxRetry: 4,
          fragLoadingTimeOut: 12000,
          fragLoadingMaxRetry: 4
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        video.play().catch(() => {});

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          startPlayback();
        });

        video.onplaying = () => {
          hideSpinner();
          $('status').textContent = `Assistindo ${c.name} (Ao Vivo)`;
        };

        video.oncanplay = () => {
          hideSpinner();
        };

        video.ontimeupdate = () => {
          if (video.currentTime > 0 && !video.paused) {
            hideSpinner();
          }
        };

        video.onwaiting = () => {
          if (waitingTimeout) clearTimeout(waitingTimeout);
          waitingTimeout = setTimeout(() => {
            if (video.paused || video.readyState < 3) {
              if (spinner) {
                spinner.style.display = 'flex';
                spinnerText.textContent = 'Bufferizando sinal...';
              }
              $('status').textContent = `Bufferizando...`;
            }
          }, 1000);
        };

        $('buffer-stat').style.display = 'inline-block';
        bufferMonitor = setInterval(() => {
          if (video.buffered.length > 0) {
            const cur = video.currentTime;
            let end = 0;
            for (let i = 0; i < video.buffered.length; i++) {
              if (video.buffered.start(i) <= cur && cur <= video.buffered.end(i)) {
                end = video.buffered.end(i);
                break;
              }
            }
            const forward = Math.max(0, end - cur);
            $('buffer-stat').textContent = `Buffer: ${forward.toFixed(1)}s`;
            $('buffer-stat').style.color = forward > 6 ? '#4ade80' : '#f59e0b';
          }
        }, 1000);

        // Watchdog anti-congelamento: recupera caso trave em tela preta ou buffer
        let lastCurTime = -1;
        let stalledCount = 0;
        watchdogTimer = setInterval(() => {
          if (!selected || !hls) {
            stalledCount = 0;
            return;
          }
          if (video.currentTime !== lastCurTime && video.currentTime > 0 && !video.paused) {
            lastCurTime = video.currentTime;
            stalledCount = 0;
            hideSpinner();
            return;
          }
          stalledCount++;
          if (stalledCount === 6) {
            console.warn('[Player Watchdog] Sinal pendente: tentando recoverMediaError...');
            if (hls) {
              hls.recoverMediaError();
              hls.startLoad();
              startPlayback();
            }
          } else if (stalledCount >= 12) {
            stalledCount = 0;
            console.warn('[Player Watchdog] Alternando canal/fluxo...');
            if (!forceProxy && directStream) {
              playChannel(c, true);
            } else {
              hls.startLoad();
            }
          }
        }, 1000);

        hls.on(Hls.Events.ERROR, (event, data) => {
          console.warn('[HLS ERROR]', data.type, data.details, data.fatal);
          if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
            hls.startLoad();
            return;
          }

          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              if (!forceProxy && directStream) {
                playChannel(c, true);
              } else {
                hls.startLoad();
              }
            } else {
              hls.destroy();
              setTimeout(() => {
                if (selected === c) playChannel(c, !forceProxy);
              }, 1500);
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        startPlayback();
      }
    }

    async function loadEPG() {
      try {
        const resp = await fetch('https://embedtv.cc/api/epg_all', { signal: AbortSignal.timeout(8000) });
        if (!resp.ok) return;
        const data = await resp.json();
        if (Array.isArray(data)) {
          for (const item of data) {
            if (item.id && Array.isArray(item.data)) {
              epgData.set(item.id.toLowerCase(), item.data);
              epgData.set(item.id.toLowerCase().replace(/[^a-z0-9]/g, ''), item.data);
            }
          }
          render();
        }
      } catch (e) {
        console.warn('Não foi possível carregar o EPG no momento.');
      }
    }

    async function loadEvents() {
      try {
        const resp = await fetch('./events', { signal: AbortSignal.timeout(6000) });
        if (!resp.ok) return;
        const data = await resp.json();
        if (Array.isArray(data)) {
          liveEvents = data;
          refreshCategories();
          render();
        }
      } catch (e) {
        console.warn('Não foi possível carregar os eventos no momento.');
      }
    }

    async function loadCatalog() {
      $('count').textContent = 'Carregando lista de canais...';
      $('reload').disabled = true;

      try {
        const response = await fetch('./multicanais-embed-catalog.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Falha ao baixar catálogo');

        const catalog = await response.json();
        const validChannels = (catalog.channels || [])
          .filter(c => c.embeds?.length > 0 || c.stream)
          .map(c => {
            return {
              ...c,
              name: c.name.replace(/&amp;/g, '&')
            };
          });

        if (!validChannels.length) throw new Error('Nenhum canal na lista');

        channels = validChannels;
        if(selected)selected=channels.find(c=>key(c)===key(selected))||selected;
        refreshCategories();
        render();

        let updatedTime = '';
        if (catalog.retrievedAt) {
          try {
            updatedTime = new Intl.DateTimeFormat('pt-BR', {
              timeZone: 'America/Sao_Paulo',
              dateStyle: 'short',
              timeStyle: 'short'
            }).format(new Date(catalog.retrievedAt));
          } catch {}
        }

        $('status').textContent = updatedTime
          ? `Catálogo sincronizado em ${updatedTime} (${channels.length} canais carregados).`
          : `Catálogo carregado (${channels.length} canais).`;

        // Carregar EPG e Eventos de Jogos em segundo plano
        loadEPG();
        loadEvents();
      } catch (err) {
        console.error(err);
        $('count').textContent = 'Erro ao carregar';
        $('status').textContent = 'Não foi possível carregar a lista de canais.';
      } finally {
        $('reload').disabled = false;
      }
    }

        const resp = await fetch('./refresh', { method: 'POST' });
        if (!resp.ok) throw new Error();
      } catch (e) {
        console.warn('Recarregando lista local.');
      }
      await loadCatalog();
    };

    // Atualização periódica do EPG (5 min) e Eventos (3 min)
    setInterval(loadEPG, 300000);
    setInterval(loadEvents, 180000);

    loadCatalog();
  </script></body></html>
