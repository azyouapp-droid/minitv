<main><section class="home-panel" id="home-panel"><h1>Sua TV,<br>do seu jeito</h1><button class="hero art art-nature" id="hero-play" aria-label="Assistir canal em destaque"><span class="live-badge">● AO VIVO</span><span class="hero-caption"><strong id="hero-title">Natureza ao vivo</strong><small id="hero-subtitle">Escolha seu próximo favorito</small></span><span class="hero-play">▶</span></button><h2 class="small-heading">Categorias</h2><div id="home-chips" class="chips home-chips"></div><div class="section-row"><h2 class="small-heading" id="favorites-title">Seus favoritos</h2><button class="text-button" id="all-channels">Ver canais</button></div><div id="favorites-row" class="favorites-row"></div></section>
<section class="watch-panel"><div class="player-wrapper" id="player-wrapper"><video id="video" playsinline style="display:none"></video><iframe id="player-frame" title="Transmissão do canal" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen style="display:none"></iframe><div id="placeholder">Escolha um canal para começar</div><div class="player-top"><button id="back" class="glass-button" aria-label="Voltar aos canais">‹</button><span class="live-badge">● AO VIVO</span></div><div class="player-controls"><div class="volume-control"><button id="mute" aria-label="Silenciar"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H2v8h4l5 4Z"/><path id="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div><button id="fullscreen" class="glass-button" aria-label="Tela cheia"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div><div id="now" class="now"></div><div class="channel-info-card"><div class="info-header"><div style="display:flex;align-items:center;gap:12px;min-width:0"><img id="player-channel-logo" class="player-channel-logo" style="display:none" alt="Logo"><div style="min-width:0"><span class="channel-type" id="channel-type">Ao vivo</span><h2 id="title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Vamos assistir?</h2></div></div><button id="current-fav" class="favorite-button" aria-label="Favoritar canal atual">♡</button></div><div id="epg-details" class="epg-details" style="display:none"><div class="epg-details-header"><span>● Agora no canal</span></div><div class="epg-title" id="epg-prog-title"></div><p class="epg-desc" id="epg-prog-desc"></p><div class="epg-next" id="epg-next-box" style="display:none"><strong>A seguir:</strong> <span id="epg-prog-next"></span></div></div><span id="buffer-stat" hidden></span><p id="status" role="status"></p><div id="options" hidden></div><button class="primary explore-button" id="explore">▦ &nbsp; Explorar canais</button><div class="next-section"><h3>Mais para você</h3><div id="recommendation"></div></div></div></section>
<section class="browse" id="browse"><div class="section-row"><h1 id="browse-title">Canais</h1><span id="count"></span></div><div class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="Buscar canal" aria-label="Buscar canal"></div><select id="category" hidden><option value="all">Todos</option></select><div id="chips" class="chips" aria-label="Categorias"></div><div id="channels" class="channel-grid"></div><p class="browse-hint">ⓘ &nbsp; O canal só muda ao tocar em Assistir.</p><button id="reload" class="text-button reload">↻ Atualizar canais</button></section></main>
<nav class="bottom-nav" aria-label="Navegação principal"><button data-view="home" aria-label="Início"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg></button><button data-view="favorites" aria-label="Favoritos"><svg viewBox="0 0 24 24"><path d="M6 3h12v19l-6-4-6 4Z"/></svg></button><button id="nav-search" class="search-button" aria-label="Pesquisar canais"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><button data-view="notifications" aria-label="Notificações"><svg viewBox="0 0 24 24"><path d="M4 18h16l-2-4V9a6 6 0 0 0-12 0v5ZM9 21h6"/></svg></button><button data-view="settings" aria-label="Configurações"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 4 3 2 3-1 2 4 3-1 1-3 4-1 1-3-3-2 1-4-3-2-3 1Z"/><circle cx="12" cy="12" r="3"/></svg></button></nav><dialog id="dialog"><button id="close-dialog" class="icon-button" aria-label="Fechar">×</button><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog></div><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>    const $ = id => document.getElementById(id);
    let channels = [];
    let selected = null;
    let hls = null;
    let bufferMonitor = null;
    let epgData = new Map();
    let liveEvents = [];

    const categories = [
      'Jogos de hoje',
      'Canais abertos',
      'Esportes',
      'Filmes e séries',
      'Infantil',
      'Natureza',
      'Variedades',
      'Notícias',
      'Religião',
      'Adulto',
      'Outros'
    ];

    function categoryOf(c) {
      if (c.isEvent || c.category === 'Jogos de hoje') return 'Jogos de hoje';
      const n = (c.name || '').toLowerCase();
      if (/sexy hot|play boy|adulto/.test(n)) return 'Adulto';
      if (/globo news|band news|cnn brasil|record news/.test(n)) return 'Notícias';
      if (/espn|sportv|sporttv|sportynet|sporty|premiere|cazetv|combate|ufc|xsports|band sports|eleven|benfica tv|canal 11|a bola|prime video [234]/.test(n)) return 'Esportes';
      if (/^(globo |record |sbt |band |cultura|rede tv)/.test(n) || /^(globo|record|sbt|band|cultura)$/.test(n)) return 'Canais abertos';
      if (/gloob|discovery kids|cartoon|cartoonito|nickelodeon|nick|24h.*(naruto|pica pau|dragon ball|chaves)|disney/.test(n)) return 'Infantil';
      if (/telecine|hbo|max -|cinemax|megapix|tnt|warner|universal|paramount|sony channel|star channel|studio universal|prime video|space|tcm|ae|amc|axn|adult swim|24h/.test(n)) return 'Filmes e séries';
      if (/aparecida|canção nova|pai eterno|rede vida/.test(n)) return 'Religião';
      if (/discovery|animal planet|national geographic|nat geo/.test(n)) return 'Natureza';
      if (/discovery|history|animal planet|food network|gnt|multishow|mtv|tlc|hgtv|master chef|a fazenda|off/.test(n)) return 'Variedades';
      return 'Outros';
    }

    function getEpgForChannel(c) {
      if (!c || !epgData.size) return null;
      const id = (c.id || '').toLowerCase();
      const rawId = (c.page || c.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const list = epgData.get(id) || epgData.get(rawId);
      if (!list || !list.length) return null;

      const now = Date.now();
      for (let i = 0; i < list.length; i++) {
        const item = list[i];
        const start = new Date(item.start_date).getTime();
        const nextStart = list[i + 1] ? new Date(list[i + 1].start_date).getTime() : (start + 3600000);
        if (now >= start && now < nextStart) {
          return {
            current: item,
            next: list[i + 1] || null
          };
        }
      }
      if (now < new Date(list[0].start_date).getTime()) {
        return { current: null, next: list[0] };
      }
      return { current: list[list.length - 1], next: null };
    }

    let view='home', hudTimer, hudHover=false, lastPointer=0;
    let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('minitv-favorites')||'[]'));}catch{}
    const key=c=>c.page||c.name;
    const icons={all:'▦','Jogos de hoje':'⚽','Canais abertos':'▣','Esportes':'⚽','Filmes e séries':'▤','Infantil':'☺','Natureza':'♧','Notícias':'▧','Variedades':'✦','Religião':'☼','Adulto':'◈','Outros':'▦'};
    const shortLabel=g=>({'all':'Todos','Jogos de hoje':'Jogos','Filmes e séries':'Filmes','Canais abertos':'Abertos'}[g]||g);
    const artOf=c=>{const g=categoryOf(c);return g==='Esportes'||g==='Jogos de hoje'?'sports':g==='Infantil'?'kids':g==='Filmes e séries'?'movies':g==='Notícias'?'news':g==='Natureza'?(/animal/.test(c.name.toLowerCase())?'jungle':'nature'):'movies';};
    const initial=c=>c.name.split(/\s+/).slice(0,2).map(w=>w[0]).join('');
    function persist(){try{localStorage.setItem('minitv-favorites',JSON.stringify([...saved]));}catch{}}
    function favorite(c){if(saved.has(key(c)))saved.delete(key(c));else saved.add(key(c));persist();render();}
    function setMode(mode){view=mode;$('app').dataset.mode=selected&&mode==='favorites'?'explore':mode;$('app').classList.remove('mode-enter');requestAnimationFrame(()=>$('app').classList.add('mode-enter'));}
    function navigate(mode){$('search').value='';$('category').value='all';if(document.fullscreenElement){setMode(mode==='favorites'?'favorites':'explore');wakeHud();}else setMode(selected&&mode==='channels'?'explore':mode);render();}
    function refreshCategories(){const current=$('category').value;const present=new Set(channels.map(categoryOf));if(liveEvents.length>0)present.add('Jogos de hoje');$('category').replaceChildren(new Option('Todos','all'));for(const name of categories)if(present.has(name))$('category').add(new Option(name,name));$('category').value=present.has(current)?current:'all';}
    function renderChips(target,home=false){
      const present=categories.filter(g=>(g==='Jogos de hoje'&&liveEvents.length>0)||channels.some(c=>categoryOf(c)===g));
      const names=home?(liveEvents.length>0?['all','Jogos de hoje','Filmes e séries','Esportes','Notícias','Infantil']:['all','Filmes e séries','Esportes','Notícias','Infantil','Natureza']):['all',...present];
      target.replaceChildren();
      for(const group of names){
        const b=document.createElement('button');
        b.className='chip'+($('category').value===group?' active':'');
        b.textContent=(icons[group]||'▦')+'  '+shortLabel(group);
        b.setAttribute('aria-pressed',String($('category').value===group));
        b.onclick=()=>{if(home)setMode(selected?'explore':'channels');$('category').value=group;render();wakeHud();};
        target.append(b);
      }
    }

    function render(){
      const term=$('search').value.toLocaleLowerCase('pt-BR').trim(),wanted=$('category').value;
      const filtered=channels.filter(c=>(view!=='favorites'||saved.has(key(c)))&&c.name.toLocaleLowerCase('pt-BR').includes(term)&&(wanted==='all'||categoryOf(c)===wanted));
      const eventMatches = (view!=='favorites' && (wanted==='all'||wanted==='Jogos de hoje')) ? liveEvents.filter(ev => {
        if(!term) return true;
        const s = ((ev.title||'')+' '+(ev.league?.name||'')+' '+(ev.teams?.home?.name||'')+' '+(ev.teams?.away?.name||'')).toLowerCase();
        return s.includes(term);
      }) : [];

      const totalCount = filtered.length + (wanted==='Jogos de hoje' ? eventMatches.length : (wanted==='all' ? eventMatches.length : 0));
      $('count').textContent = totalCount + (totalCount===1 ? ' canal/evento' : ' canais');
      $('browse-title').textContent = view==='favorites' ? 'Seus favoritos' : selected ? 'Escolha o próximo canal' : 'Canais';
      renderChips($('chips'));renderChips($('home-chips'),true);$('channels').replaceChildren();

      // Renderizar Jogos de Hoje se houver
      if (eventMatches.length > 0 && (wanted==='all' || wanted==='Jogos de hoje')) {
        const evHeading = document.createElement('h2');
        evHeading.className = 'group-title';
        evHeading.textContent = '⚽ Jogos de hoje';
        $('channels').append(evHeading);

        for (const ev of eventMatches) {
          const pseudo = {
            name: ev.title,
            page: 'event-' + (ev.id || ev.title),
            category: 'Jogos de hoje',
            isEvent: true,
            image: ev.league?.image || ev.teams?.home?.image || '',
            embeds: (ev.players || []).map((url, i) => ({ label: `Opção ${i+1}`, url })),
            stream: ''
          };
          const active = selected && selected.page === pseudo.page;
          const card = document.createElement('article');
          card.className = 'channel-card event-card' + (active ? ' active' : '');

          const thumb = document.createElement('div');
          thumb.className = 'channel-thumb art art-sports';
          if (ev.league?.image) {
            const limg = document.createElement('img');
            limg.src = ev.league.image;
            limg.className = 'channel-logo';
            limg.alt = ev.league.name || 'Liga';
            limg.loading = 'lazy';
            limg.onerror = () => limg.remove();
            thumb.append(limg);
          }

          const content = document.createElement('div');
          content.className = 'card-content';
          const meta = document.createElement('div');
          meta.className = 'card-meta';
          const cat = document.createElement('span');
          cat.className = 'card-category';
          cat.textContent = ev.league?.name || 'Futebol';

          const nowMs = Date.now();
          const startMs = ev.time_start ? new Date(ev.time_start).getTime() : 0;
          const endMs = ev.time_end ? new Date(ev.time_end).getTime() : (startMs + 7200000);
          const isLive = startMs && (startMs <= nowMs && nowMs <= endMs);
          const timeStr = ev.time_start ? new Intl.DateTimeFormat('pt-BR', { hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' }).format(new Date(ev.time_start)) : '';

          const badge = document.createElement('span');
          badge.className = isLive ? 'event-live-badge' : 'event-time-badge';
          badge.textContent = isLive ? '● AO VIVO' : `⏰ ${timeStr}`;
          meta.append(cat, badge);

          const h = document.createElement('h3');
          h.textContent = ev.title;

          if (ev.teams?.home || ev.teams?.away) {
            const matchup = document.createElement('div');
            matchup.className = 'event-matchup';
            const hTeam = document.createElement('div');
            hTeam.className = 'event-team';
            if (ev.teams.home?.image) {
              const hImg = document.createElement('img');
              hImg.src = ev.teams.home.image;
              hImg.alt = '';
              hImg.onerror = () => hImg.remove();
              hTeam.append(hImg);
            }
            const hName = document.createElement('span');
            hName.textContent = ev.teams.home?.name || 'Mandante';
            hTeam.append(hName);

            const vs = document.createElement('span');
            vs.className = 'event-vs';
            vs.textContent = 'VS';

            const aTeam = document.createElement('div');
            aTeam.className = 'event-team';
            if (ev.teams.away?.image) {
              const aImg = document.createElement('img');
              aImg.src = ev.teams.away.image;
              aImg.alt = '';
              aImg.onerror = () => aImg.remove();
              aTeam.append(aImg);
            }
            const aName = document.createElement('span');
            aName.textContent = ev.teams.away?.name || 'Visitante';
            aTeam.append(aName);

            matchup.append(hTeam, vs, aTeam);
            content.append(meta, h, matchup);
          } else {
            const desc = document.createElement('p');
            desc.className = 'card-description';
            desc.textContent = isLive ? 'Partida em andamento' : `Transmissão às ${timeStr}`;
            content.append(meta, h, desc);
          }

          const actions = document.createElement('div');
          actions.className = 'card-actions';
          const play = document.createElement('button');
          play.className = 'watch-btn';
          play.textContent = active ? 'Assistindo' : '▶ Assistir jogo';
          play.onclick = () => { playChannel(pseudo); wakeHud(); };
          actions.append(play);
          content.append(actions);

          card.append(thumb, content);
          $('channels').append(card);
        }
      } else if (wanted === 'Jogos de hoje' && liveEvents.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Nenhuma partida agendada para este momento. Volte mais tarde!';
        $('channels').append(p);
      }

      if(!filtered.length && wanted !== 'Jogos de hoje'){
        const p=document.createElement('p');
        p.className='empty';
        p.textContent=view==='favorites'?'Salve seus canais no coração. Eles ficam aqui.':channels.length?'Nenhum canal encontrado. Tente outra busca.':'Carregando canais…';
        $('channels').append(p);
      }

      for(const group of categories){
        if(group === 'Jogos de hoje') continue;
        const items=filtered.filter(c=>categoryOf(c)===group).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{numeric:true}));
        if(!items.length)continue;
        const heading=document.createElement('h2');
        heading.className='group-title';
        heading.textContent=group;
        $('channels').append(heading);

        for(const c of items){
          const active=selected&&key(c)===key(selected);
          const card=document.createElement('article');
          card.className='channel-card'+(active?' active':'');
          const thumb=document.createElement('div');
          thumb.className='channel-thumb art art-'+artOf(c);
          thumb.setAttribute('aria-hidden','true');

          if (c.image) {
            const img = document.createElement('img');
            img.src = c.image;
            img.className = 'channel-logo';
            img.alt = c.name;
            img.loading = 'lazy';
            img.onerror = () => img.remove();
            thumb.append(img);
          }

          const content=document.createElement('div');
          content.className='card-content';
          const meta=document.createElement('div');
          meta.className='card-meta';
          const cat=document.createElement('span');
          cat.className='card-category';
          cat.textContent=shortLabel(group);
          const live=document.createElement('span');
          live.className='live-badge';
          live.textContent='● AO VIVO';
          meta.append(cat,live);
          const h=document.createElement('h3');
          h.textContent=c.name;
          const desc=document.createElement('p');
          desc.className='card-description';

          const epg = getEpgForChannel(c);
          if (epg && epg.current) {
            desc.innerHTML = `<span class="card-epg-now">Agora:</span> ${epg.current.title}`;
            desc.title = epg.current.desc || epg.current.title;
          } else {
            desc.textContent=active?'Assistindo agora':'Transmissão ao vivo';
          }

          const actions=document.createElement('div');
          actions.className='card-actions';
          const play=document.createElement('button');
          play.className='watch-btn';
          play.textContent=active?'Assistindo':'▶ Assistir';
          play.setAttribute('aria-label',(active?'Assistindo: ':'Assistir: ')+c.name);
          play.onclick=()=>{if(!active)playChannel(c);else if(!document.fullscreenElement){setMode('live');render();}wakeHud();};
          const fav=document.createElement('button');
          fav.className='favorite-button'+(saved.has(key(c))?' saved':'');
          fav.textContent=saved.has(key(c))?'♥':'♡';
          fav.setAttribute('aria-label',(saved.has(key(c))?'Remover dos favoritos: ':'Favoritar: ')+c.name);
          fav.setAttribute('aria-pressed',String(saved.has(key(c))));
          fav.onclick=()=>favorite(c);
          actions.append(play,fav);
          content.append(meta,h,desc,actions);
          card.append(thumb,content);
          $('channels').append(card);
        }
      }

      const featured=channels.find(c=>c.name==='Discovery Channel')||channels.find(c=>categoryOf(c)==='Natureza')||channels[0];
      if(featured){
        $('hero-title').textContent=featured.name;
        $('hero-subtitle').textContent='Natureza, descobertas e histórias';
        $('hero-play').onclick=()=>playChannel(featured);
      }

      const favorites=channels.filter(c=>saved.has(key(c)));
      const tiles=favorites.length?favorites:channels.filter(c=>['Discovery Channel','Espn','Cartoon Network','Globo SP','HBO','CNN Brasil'].includes(c.name)).slice(0,6);
      $('favorites-title').textContent=favorites.length?'Seus favoritos':'Para começar';
      $('favorites-row').replaceChildren();
      for(const c of tiles.slice(0,6)){
        const b=document.createElement('button');
        b.className='favorite-tile';
        const mark=document.createElement('span');
        mark.className='channel-mark';
        if (c.image) {
          const mImg = document.createElement('img');
          mImg.src = c.image;
          mImg.style.width = '24px';
          mImg.style.height = '24px';
          mImg.style.objectFit = 'contain';
          mImg.onerror = () => { mImg.remove(); mark.textContent = initial(c); };
          mark.append(mImg);
        } else {
          mark.textContent=initial(c);
        }
        const label=document.createElement('span');
        label.textContent=c.name;
        b.append(mark,label);
        b.onclick=()=>playChannel(c);
        $('favorites-row').append(b);
      }

      $('current-fav').textContent=selected&&saved.has(key(selected))?'♥':'♡';
      $('current-fav').classList.toggle('saved',!!selected&&saved.has(key(selected)));
      if(selected){
        $('now').textContent=selected.name+' • Assistindo agora';
        $('channel-type').textContent=selected.isEvent ? 'Evento Esportivo' : categoryOf(selected);

        const logoNode = $('player-channel-logo');
        if (logoNode) {
          if (selected.image) {
            logoNode.src = selected.image;
            logoNode.style.display = 'block';
          } else {
            logoNode.style.display = 'none';
          }
        }

        const epgBox = $('epg-details');
        if (epgBox) {
          const epg = getEpgForChannel(selected);
          if (epg && epg.current) {
            epgBox.style.display = 'block';
            $('epg-prog-title').textContent = epg.current.title;
            $('epg-prog-desc').textContent = (epg.current.desc && epg.current.desc !== 'Sinopse não disponível.') ? epg.current.desc : '';
            if (epg.next) {
              $('epg-next-box').style.display = 'block';
              $('epg-prog-next').textContent = epg.next.title;
            } else {
              $('epg-next-box').style.display = 'none';
            }
          } else {
            epgBox.style.display = 'none';
          }
        }

        const next=channels.find(c=>key(c)!==key(selected)&&categoryOf(c)===categoryOf(selected));
        $('recommendation').replaceChildren();
        if(next){
          const b=document.createElement('button');
          b.className='next-card';
          const art=document.createElement('span');
          art.className='art art-'+artOf(next);
          if (next.image) {
            const im = document.createElement('img');
            im.src = next.image;
            im.className = 'channel-logo';
            im.style.width = '50px';
            im.style.height = '50px';
            im.onerror = () => im.remove();
            art.append(im);
          }
          const text=document.createElement('span');
          const title=document.createElement('strong');
          title.textContent=next.name;
          const sub=document.createElement('small');
          sub.textContent='Ao vivo • '+categoryOf(next);
          text.append(title,sub);
          b.append(art,text);
          b.onclick=()=>playChannel(next);
          $('recommendation').append(b);
        }
      }
      document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
    }
    function wakeHud(){if(!document.fullscreenElement)return;$('app').classList.add('hud-visible');clearTimeout(hudTimer);hudTimer=setTimeout(()=>{const focused=document.activeElement;if(hudHover||focused?.matches('input')||$('dialog').open){wakeHud();return;}$('app').classList.remove('hud-visible');},3500);}
    $('app').addEventListener('pointermove',()=>{if(Date.now()-lastPointer>150){lastPointer=Date.now();wakeHud();}});$('app').addEventListener('pointerdown',wakeHud);$('app').addEventListener('keydown',wakeHud);
    for(const node of [$('browse'),document.querySelector('.bottom-nav')]){node.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hudHover=true;});node.addEventListener('pointerleave',()=>{hudHover=false;wakeHud();});}
    $('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('app').requestFullscreen)await $('app').requestFullscreen();else if($('video').webkitEnterFullscreen)$('video').webkitEnterFullscreen();}catch{$('status').textContent='A tela cheia não está disponível neste navegador.';}};
    document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;$('fullscreen').setAttribute('aria-label',full?'Sair da tela cheia':'Tela cheia');if(full){setMode('explore');render();wakeHud();}else{clearTimeout(hudTimer);$('app').classList.remove('hud-visible');hudHover=false;setMode('explore');render();}});
    const syncVolume=()=>{const v=$('video');$('volume').value=v.muted?0:v.volume;const silent=v.muted||v.volume===0;$('mute').setAttribute('aria-label',silent?'Ativar som':'Silenciar');$('sound-waves').setAttribute('d',silent?'m16 9 6 6m0-6-6 6':'M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14');};$('volume').oninput=()=>{const v=$('video');v.volume=Number($('volume').value);v.muted=v.volume===0;syncVolume();};$('mute').onclick=()=>{const v=$('video');if(v.muted||v.volume===0){v.muted=false;if(v.volume===0)v.volume=.5;}else v.muted=true;syncVolume();};$('video').addEventListener('volumechange',syncVolume);
    function search(){navigate(selected?'explore':'channels');$('search').focus();wakeHud();}
    function dialog(title,text){$('dialog-title').textContent=title;$('dialog-body').textContent=text;$('dialog').showModal();}
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const dest=b.dataset.view;if(dest==='notifications'){dialog('Notificações','Você não tem novas notificações.');return;}if(dest==='settings'){dialog('Sua Mini TV','Os favoritos ficam salvos neste navegador. Use o controle no vídeo para ajustar o volume e entrar em tela cheia. As imagens dos cards ilustram as categorias.');return;}navigate(dest);});
    $('profile').onclick=()=>document.querySelector('[data-view="settings"]').click();$('brand').onclick=e=>{e.preventDefault();navigate('home');};$('nav-search').onclick=search;$('top-search').onclick=search;$('all-channels').onclick=()=>navigate('channels');$('explore').onclick=()=>navigate('explore');$('back').onclick=()=>navigate('explore');$('current-fav').onclick=()=>{if(selected)favorite(selected);};$('close-dialog').onclick=()=>$('dialog').close();

    async function playChannel(c, embedIndex = 0) {
      selected = c;
      setMode(document.fullscreenElement ? 'explore' : 'live');
      render();

      $('placeholder').style.display = 'none';
      $('title').textContent = c.name;
      $('options').replaceChildren();

      const video = $('video');
      const frame = $('player-frame');

      // Garantir SEMPRE o player nativo <video> ativo e iframe desligado:
      if (frame) {
        frame.style.display = 'none';
        frame.src = 'about:blank';
      }
      video.style.display = 'block';

      if (bufferMonitor) clearInterval(bufferMonitor);
      $('buffer-stat').style.display = 'none';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.onclick = () => {
        if (document.fullscreenElement) wakeHud();
        else if (video.paused) video.play().catch(() => {});
      };
      video.pause();
      video.removeAttribute('src');
      video.load();

      const embedUrl = c.embeds?.[embedIndex]?.url || c.embeds?.[0]?.url || (c.url || '');
      const streamUrl = c.stream || '';
      const proxiedM3u8 = c.ingestUrl || `/m3u8?url=${encodeURIComponent(streamUrl)}&embed=${encodeURIComponent(embedUrl)}`;

      $('status').textContent = `Conectando stream de ${c.name}...`;

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxLiveSyncPlaybackRate: 1.0,      // NUNCA acelerar reprodução para evitar esgotar buffer
          liveSyncDurationCount: 3,         // 3 blocos de segurança (~18s da ponta)
          liveMaxLatencyDurationCount: 6,
          maxBufferLength: 25,              // Janela compatível de armazenamento de buffer
          maxMaxBufferLength: 45,
          backBufferLength: 15,
          maxBufferSize: 60 * 1024 * 1024,  // 60MB de buffer
          highBufferWatchdogPeriod: 2,
          nudgeOffset: 0.2,
          nudgeMaxRetry: 5,
          fragLoadingTimeOut: 15000,
          fragLoadingMaxRetry: 6,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 6
        });

        hls.loadSource(proxiedM3u8);
        hls.attachMedia(video);

        let playTriggered = false;
        const startPlayback = () => {
          if (playTriggered) return;
          playTriggered = true;
          video.play().then(() => {
            $('status').textContent = `Assistindo ${c.name} (Ao Vivo)`;
          }).catch(() => {
            $('status').textContent = `Clique no player de vídeo para iniciar.`;
          });
        };

        video.oncanplay = startPlayback;
        video.onplaying = () => {
          $('status').textContent = `Assistindo ${c.name} (Ao Vivo)`;
        };
        video.onwaiting = () => {
          $('status').textContent = `Bufferizando...`;
        };

        // Monitor de Buffer em tempo real:
        $('buffer-stat').style.display = 'inline-block';
        bufferMonitor = setInterval(() => {
          if (video.buffered.length > 0) {
            const cur = video.currentTime;
            let end = 0;
            for (let i = 0; i < video.buffered.length; i++) {
              if (video.buffered.start(i) <= cur && cur <= video.buffered.end(i)) {
                end = video.buffered.end(i);
                break;
              }
            }
            const forward = Math.max(0, end - cur);
            $('buffer-stat').textContent = `Buffer: ${forward.toFixed(1)}s`;
            $('buffer-stat').style.color = forward > 6 ? '#4ade80' : '#f59e0b';
          }
        }, 1000);

        let networkErrors = 0;
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && networkErrors < 4) {
              networkErrors++;
              $('status').textContent = 'Reconectando dados de rede...';
              hls.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              $('status').textContent = 'Recarregando sinal ao vivo...';
              setTimeout(() => {
                if (selected === c) playChannel(c, embedIndex);
              }, 2000);
            }
          }
        });
      } else {
        video.src = proxiedM3u8;
        video.play().catch(() => {});
      }

      // Botão de recarregar sinal rápido
      const reloadBtn = document.createElement('button');
      reloadBtn.className = 'opt-btn active';
      reloadBtn.innerHTML = '⚡ Recarregar Sinal';
      reloadBtn.onclick = () => playChannel(c, embedIndex);
      $('options').append(reloadBtn);

      // Se houver mais de um sinal ou opção de transmissão:
      if (c.embeds && c.embeds.length > 1) {
        c.embeds.forEach((emb, idx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn' + (idx === embedIndex ? ' active' : '');
          btn.textContent = emb.label || `Sinal ${idx + 1}`;
          btn.onclick = () => playChannel(c, idx);
          $('options').append(btn);
        });
      }
    }

    async function loadEPG() {
      try {
        const resp = await fetch('https://embedtv.cc/api/epg_all', { signal: AbortSignal.timeout(8000) });
        if (!resp.ok) return;
        const data = await resp.json();
        if (Array.isArray(data)) {
          for (const item of data) {
            if (item.id && Array.isArray(item.data)) {
              epgData.set(item.id.toLowerCase(), item.data);
              epgData.set(item.id.toLowerCase().replace(/[^a-z0-9]/g, ''), item.data);
            }
          }
          render();
        }
      } catch (e) {
        console.warn('Não foi possível carregar o EPG no momento.');
      }
    }

    async function loadEvents() {
      try {
        const resp = await fetch('./events', { signal: AbortSignal.timeout(6000) });
        if (!resp.ok) return;
        const data = await resp.json();
        if (Array.isArray(data)) {
          liveEvents = data;
          refreshCategories();
          render();
        }
      } catch (e) {
        console.warn('Não foi possível carregar os eventos no momento.');
      }
    }

    async function loadCatalog() {
      $('count').textContent = 'Carregando lista de canais...';
      $('reload').disabled = true;

      try {
        const response = await fetch('./multicanais-embed-catalog.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Falha ao baixar catálogo');

        const catalog = await response.json();
        const validChannels = (catalog.channels || [])
          .filter(c => c.embeds?.length > 0 || c.stream)
          .map(c => {
            return {
              ...c,
              name: c.name.replace(/&amp;/g, '&')
            };
          });

        if (!validChannels.length) throw new Error('Nenhum canal na lista');

        channels = validChannels;
        if(selected)selected=channels.find(c=>key(c)===key(selected))||selected;
        refreshCategories();
        render();

        let updatedTime = '';
        if (catalog.retrievedAt) {
          try {
            updatedTime = new Intl.DateTimeFormat('pt-BR', {
              timeZone: 'America/Sao_Paulo',
              dateStyle: 'short',
              timeStyle: 'short'
            }).format(new Date(catalog.retrievedAt));
          } catch {}
        }

        $('status').textContent = updatedTime
          ? `Catálogo sincronizado em ${updatedTime} (${channels.length} canais carregados).`
          : `Catálogo carregado (${channels.length} canais).`;

        // Carregar EPG e Eventos de Jogos em segundo plano
        loadEPG();
        loadEvents();
      } catch (err) {
        console.error(err);
        $('count').textContent = 'Erro ao carregar';
        $('status').textContent = 'Não foi possível carregar a lista de canais.';
      } finally {
        $('reload').disabled = false;
      }
    }

    $('search').oninput = ()=>{if(view==='home')setMode(selected?'explore':'channels');render();wakeHud();};
    $('category').onchange = render;

    $('reload').onclick = async () => {
      $('reload').disabled = true;
      $('count').textContent = 'Atualizando canais e eventos...';
      try {
        const resp = await fetch('./refresh', { method: 'POST' });
        if (!resp.ok) throw new Error();
      } catch (e) {
        console.warn('Recarregando lista local.');
      }
      await loadCatalog();
    };

    // Atualização periódica do EPG (5 min) e Eventos (3 min)
    setInterval(loadEPG, 300000);
    setInterval(loadEvents, 180000);

    loadCatalog();
  </script></body></html>
